name: Build TrickyMind3D Arena Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle 8.7 Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        cache-read-only: false

    - name: Build Debug APK with Stacktrace
      run: gradle assembleDebug --stacktrace --no-daemon
